[package]
name = "stacks-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "stacks-api"

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "stacks-api"
path = "src/main.rs"

[[bin]]
name = "gen-openapi"
path = "src/bin/gen_openapi.rs"

[dependencies]
stacks-core = { path = "../core" }
migration = { path = "../core/migration" }
sea-orm = { workspace = true }
tokio = { workspace = true }
eyre = { workspace = true }
color-eyre = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
salvo = { version = "0.77", features = ["oapi", "logging", "cors", "jwt-auth", "affix-state"] }
chrono = { workspace = true }
dotenvy = "0.15.7"
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
