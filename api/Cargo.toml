[package]
name = "stacks-api"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"
# Not published to crates.io — this is a self-hosted application, not a library.
publish = false
rust-version = "1.99"
default-run = "stacks-api"

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "stacks-api"
path = "src/main.rs"

[[bin]]
name = "gen-openapi"
path = "src/bin/gen_openapi.rs"

[dependencies]
stacks-core = { path = "../core" }
migration = { path = "../core/migration" }
kynos = { workspace = true }
sea-orm = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
dotenvy = "0.15.7"

[dev-dependencies]
# The suites set up state through core's test-support shorthands.
stacks-core = { path = "../core", features = ["test-support"] }
kynos = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
reqwest = { workspace = true }
bytes = "1"
# Reads the CSV export back in its tests.
csv = { workspace = true }
openidconnect = { workspace = true }
# The mock identity provider signs RS256 id_tokens with a key it generates.
rsa = { version = "0.9", features = ["getrandom"] }
sha2 = { workspace = true }
url = "2"

[lints.clippy]
# Request handling never unwraps: every failure is a declared response.
# Tests opt back in with `#[allow]` where a panic is the assertion.
unwrap_used = "deny"
expect_used = "deny"

# `cargo test` (and so `mise run test:api`) also runs the harness's TestClient
# conformance suite, which lives beside the router in the example itself.
[[example]]
name = "contract"
test = true
