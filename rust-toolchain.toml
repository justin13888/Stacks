[toolchain]
# An exact stable release, so every machine, CI job and Docker image builds
# with the same compiler. Bump it together with `rust-version` in each crate,
# `msrv` in clippy.toml and the rust image tag in api/Dockerfile.
channel = "1.99.1"
components = ["rustfmt", "clippy", "rust-analyzer", "llvm-tools-preview"]
