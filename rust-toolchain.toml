[toolchain]
# Floats on the latest stable release: a new Rust release is picked up with no
# bump anywhere, and anything it breaks (a new lint, a changed diagnostic) is
# fixed in-repo when it lands. `rust-version` in each crate is only a floor.
channel = "stable"
components = ["rustfmt", "clippy", "rust-analyzer", "llvm-tools-preview"]
