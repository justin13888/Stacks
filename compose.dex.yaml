# Development-only OIDC provider. Opt in with the `dev-idp` profile:
#   just up            (includes it)
#   docker compose --profile dev-idp up -d
#
# Without a profile set, `docker compose up` skips this service entirely, so a
# production deployment pointing WW_OIDC_* at a real provider is unaffected.
services:
  dex:
    image: docker.io/dexidp/dex:v2.41.1
    profiles: ["dev-idp"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      # `z` relabels the file for SELinux hosts (Fedora, RHEL); without it Dex
      # is denied its config and restart-loops. Ignored elsewhere.
      - ./deploy/dex/config.yaml:/etc/dex/config.yaml:ro,z
    # Loopback only: the client secret and passwords in its config are public.
    # The browser reaches it on localhost, the API on the compose network.
    ports:
      - "127.0.0.1:5556:5556"
    healthcheck:
      # Healthy means the issuer the API verifies tokens against answers: fetch
      # the discovery document with the image's busybox wget.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:5556/dex/.well-known/openid-configuration",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
