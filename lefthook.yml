# Stacks — git hooks.
#
# All commands route through `mise run` (see mise.toml) so the same tasks
# back the hooks, CI, and ad-hoc local runs. Don't inline cargo/biome commands
# here; add or extend the corresponding task instead.

pre-commit:
  piped: true
  commands:
    # --- Priority 1: format-fix (all packages in parallel) ---
    format-fix-api:
      priority: 1
      glob: "api/**/*.rs"
      stage_fixed: true
      run: mise run format:api
    format-fix-core:
      priority: 1
      glob: "core/**/*.rs"
      stage_fixed: true
      run: mise run format:core
    format-fix-web:
      priority: 1
      glob: "web/**/*.{ts,tsx,js,jsx}"
      stage_fixed: true
      run: mise run format:web

    # --- Priority 2: lint-fix (all packages in parallel, AFTER format-fix) ---
    lint-fix-api:
      priority: 2
      glob: "api/**/*.rs"
      stage_fixed: true
      run: mise run lint-fix:api
    lint-fix-core:
      priority: 2
      glob: "core/**/*.rs"
      stage_fixed: true
      run: mise run lint-fix:core
    lint-fix-web:
      priority: 2
      glob: "web/**/*.{ts,tsx,js,jsx}"
      stage_fixed: true
      run: mise run lint-fix:web

# Enforce Conventional Commits so release-please can generate CHANGELOG.md.
# The rule (types, scopes, header length) lives in .versionrc and the
# `commit-lint` task; CI applies it to PR titles and master pushes.
# Needs convco, which `mise install` provides.
commit-msg:
  commands:
    conventional-format:
      run: mise run commit-lint "{1}"

# Every task `mise run check` runs, so a push that passes here passes it too.
pre-push:
  parallel: true
  commands:
    format-check-api:
      run: mise run format-check:api
    format-check-core:
      run: mise run format-check:core
    format-check-e2e:
      run: mise run format-check:e2e
    format-check-web:
      run: mise run format-check:web
    format-check-browser:
      run: mise run format-check:browser
    lint-api:
      run: mise run lint:api
    lint-core:
      run: mise run lint:core
    lint-e2e:
      run: mise run lint:e2e
    lint-web:
      run: mise run lint:web
    lint-browser:
      run: mise run lint:browser
    typecheck-web:
      run: mise run typecheck:web
    typecheck-browser:
      run: mise run typecheck:browser
    test-api:
      run: mise run test:api
    test-core:
      run: mise run test:core
    test-e2e:
      run: mise run test:e2e
    test-web:
      run: mise run test:web
    contract:
      run: mise run contract
    check-openapi:
      run: mise run check:openapi
    check-env-docs:
      run: mise run check:env-docs
    check-file-length:
      run: mise run check:file-length
