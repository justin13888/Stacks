pre-commit:
  piped: true
  commands:
    # --- Priority 1: format-fix (all packages in parallel) ---
    format-fix-api:
      priority: 1
      root: "api/"
      glob: "api/**/*.rs"
      stage_fixed: true
      run: cargo fmt
    format-fix-core:
      priority: 1
      root: "core/"
      glob: "core/**/*.rs"
      stage_fixed: true
      run: cargo fmt
    format-fix-web:
      priority: 1
      root: "web/"
      glob: "web/**/*.{ts,tsx,js,jsx}"
      stage_fixed: true
      run: bunx biome format --write {staged_files}

    # --- Priority 2: lint-fix (all packages in parallel, AFTER format-fix) ---
    lint-fix-api:
      priority: 2
      root: "api/"
      glob: "api/**/*.rs"
      stage_fixed: true
      run: cargo clippy --fix --allow-dirty --allow-staged
    lint-fix-core:
      priority: 2
      root: "core/"
      glob: "core/**/*.rs"
      stage_fixed: true
      run: cargo clippy --fix --allow-dirty --allow-staged
    lint-fix-web:
      priority: 2
      root: "web/"
      glob: "web/**/*.{ts,tsx,js,jsx}"
      stage_fixed: true
      run: bunx biome lint --fix {staged_files}

# Enforce conventional-commit subjects so the changelog stays tidy. Matches
# `type(scope)?!?: subject` for the standard set of types.
commit-msg:
  commands:
    conventional-format:
      run: |
        grep -qE '^(feat|fix|chore|docs|refactor|perf|test|build|ci|style|revert)(\([^)]+\))?!?: .+' "{1}" \
          || (echo "Commit subject must follow Conventional Commits (e.g. 'feat(api): add X')"; exit 1)

pre-push:
  parallel: true
  commands:
    format-check-api:
      root: "api/"
      run: cargo fmt --check
    format-check-core:
      root: "core/"
      run: cargo fmt --check
    format-check-web:
      root: "web/"
      run: bun run format
    lint-check-api:
      root: "api/"
      run: cargo clippy --all-targets -- -D warnings
    lint-check-core:
      root: "core/"
      run: cargo clippy --all-targets -- -D warnings
    lint-check-web:
      root: "web/"
      run: bun run lint
    typecheck-web:
      root: "web/"
      run: bun run check
    test-api:
      root: "api/"
      run: cargo test
    test-core:
      root: "core/"
      run: cargo test
    test-web:
      root: "web/"
      run: bun test
