# Stacks — git hooks.
#
# All commands route through `just` (see Justfile) so the same recipes back
# the hooks, CI, and ad-hoc local runs. Don't inline cargo/biome commands
# here; add or extend the corresponding recipe instead.

pre-commit:
  piped: true
  commands:
    # --- Priority 1: format-fix (all packages in parallel) ---
    format-fix-api:
      priority: 1
      glob: "api/**/*.rs"
      stage_fixed: true
      run: just format-api
    format-fix-core:
      priority: 1
      glob: "core/**/*.rs"
      stage_fixed: true
      run: just format-core
    format-fix-web:
      priority: 1
      glob: "web/**/*.{ts,tsx,js,jsx}"
      stage_fixed: true
      run: just format-web

    # --- Priority 2: lint-fix (all packages in parallel, AFTER format-fix) ---
    lint-fix-api:
      priority: 2
      glob: "api/**/*.rs"
      stage_fixed: true
      run: just lint-fix-api
    lint-fix-core:
      priority: 2
      glob: "core/**/*.rs"
      stage_fixed: true
      run: just lint-fix-core
    lint-fix-web:
      priority: 2
      glob: "web/**/*.{ts,tsx,js,jsx}"
      stage_fixed: true
      run: just lint-fix-web

# Enforce Conventional Commits so release-please can generate CHANGELOG.md.
# The rule (types, scopes, header length) lives in .versionrc and the
# `commit-lint` recipe; CI applies the same recipe to PR titles and ranges.
# Needs `convco` on PATH (`cargo install convco`).
commit-msg:
  commands:
    conventional-format:
      run: just commit-lint "{1}"

pre-push:
  parallel: true
  commands:
    format-check-api:
      run: just format-check-api
    format-check-core:
      run: just format-check-core
    format-check-web:
      run: just format-check-web
    lint-api:
      run: just lint-api
    lint-core:
      run: just lint-core
    lint-web:
      run: just lint-web
    typecheck-web:
      run: just typecheck-web
    test-api:
      run: just test-api
    test-core:
      run: just test-core
    test-web:
      run: just test-web
    contract:
      run: just contract
