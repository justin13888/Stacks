# The Stacks API and web app, on the images the release workflow publishes
# (ghcr.io/justin13888/stacks-{api,web}, attested; see docs/DEPLOY.md).
#
# Pin a release with STACKS_VERSION (e.g. `v0.1.0`, or `0.1` for the newest
# patch); it defaults to `latest`. To run what is checked out instead, layer
# compose.build.yaml on top (`just up` does).
#
# Every WW_* variable is documented in docs/DEPLOY.md; `just check-env-docs`
# fails when one is missing there. Only variables whose empty value means
# "unset" are passed through bare, because an empty value set on the
# container would otherwise replace the built-in default.
services:
  stacks-api:
    image: ghcr.io/justin13888/stacks-api:${STACKS_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WW_DATABASE_URL: postgres://stacks:${POSTGRES_PASSWORD:-stacks}@postgres:5432/stacks
      WW_TMDB_API_KEY: ${WW_TMDB_API_KEY}
      WW_OIDC_ISSUER: ${WW_OIDC_ISSUER}
      WW_OIDC_CLIENT_ID: ${WW_OIDC_CLIENT_ID}
      WW_OIDC_CLIENT_SECRET: ${WW_OIDC_CLIENT_SECRET}
      WW_OIDC_REDIRECT_URI: ${WW_OIDC_REDIRECT_URI:-http://localhost:3000/auth/callback}
      # Browser and API reach the IdP on different hosts; see the comment on
      # OidcConfig::internal_issuer. Only needed for the bundled dev Dex.
      WW_OIDC_INTERNAL_ISSUER: ${WW_OIDC_INTERNAL_ISSUER:-}
      WW_ADMIN_EMAILS: ${WW_ADMIN_EMAILS:-}
      WW_LOG_LEVEL: ${WW_LOG_LEVEL:-}
      WW_METRICS_TOKEN: ${WW_METRICS_TOKEN:-}
      WW_SESSION_TTL_SECS: ${WW_SESSION_TTL_SECS:-}
      WW_RATE_LIMIT_PER_MINUTE: ${WW_RATE_LIMIT_PER_MINUTE:-}
      WW_IMPORT_MAX_BYTES: ${WW_IMPORT_MAX_BYTES:-}
      WW_NOTIFICATION_ALLOWED_HOSTS: ${WW_NOTIFICATION_ALLOWED_HOSTS:-}
      WW_CORS_ALLOWED_ORIGINS: ${WW_CORS_ALLOWED_ORIGINS:-}
      WW_TRUSTED_PROXY_HOPS: ${WW_TRUSTED_PROXY_HOPS:-}
      WW_METADATA_CONNECT_TIMEOUT_SECS: ${WW_METADATA_CONNECT_TIMEOUT_SECS:-}
      WW_METADATA_REQUEST_TIMEOUT_SECS: ${WW_METADATA_REQUEST_TIMEOUT_SECS:-}
      WW_JOB_RETENTION_DAYS: ${WW_JOB_RETENTION_DAYS:-}
      WW_FAILED_JOB_RETENTION_DAYS: ${WW_FAILED_JOB_RETENTION_DAYS:-}
      WW_TMDB_BASE_URL: ${WW_TMDB_BASE_URL:-}
      WW_ANILIST_BASE_URL: ${WW_ANILIST_BASE_URL:-}
      # A path inside the container: mount the file there as well.
      WW_CONFIG_FILE: ${WW_CONFIG_FILE:-config.toml}
      # `-` rather than `:-`: unset means the default, but an empty value
      # is kept, and an empty WW_METRICS_BIND disables the operator listener.
      WW_METRICS_BIND: ${WW_METRICS_BIND-0.0.0.0:9095}
      # Fixed, not passed through: the published port, the healthcheck below
      # and stacks-web's proxy all reach the API on 8095.
      WW_BIND: 0.0.0.0:8095
    # Loopback only. The API trusts one X-Forwarded-For hop
    # (WW_TRUSTED_PROXY_HOPS), so a client that reached it directly could
    # name any address it liked; remote clients come through stacks-web.
    # 9095 is the operator listener (/metrics); scrape it from the host or
    # from a Prometheus on this compose network.
    ports:
      - "127.0.0.1:8095:8095"
      - "127.0.0.1:9095:9095"
    healthcheck:
      # Ready means the database answers and its schema is current
      # (`GET /readyz`); `/healthz` only says the process is up. The runtime
      # image has no curl, so bash's /dev/tcp sends the request. The script is
      # a block scalar because its `Host: ` would otherwise parse as a mapping.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8095 &&
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  stacks-web:
    image: ghcr.io/justin13888/stacks-web:${STACKS_VERSION:-latest}
    depends_on:
      stacks-api:
        condition: service_healthy
    # No environment here on purpose: nginx proxies /api to stacks-api on the
    # compose network, so the SPA talks to its own origin and needs no API URL.
    ports:
      - "${STACKS_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
