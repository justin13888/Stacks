# Dependabot keeps the lockfiles, the Dockerfile base images and the workflow
# actions current. Every update is grouped, weekly, per directory.
#
# Commit messages must pass `just commit-lint` (types and scopes in
# .versionrc): `chore(deps)` for dependencies and base images, `ci(deps)` for
# workflow actions. The prefixes are explicit because `include: scope` would
# emit `deps-dev`, which is not an allowed scope. A pull request's title is its
# squash commit and CI lints it with the ` (#N)` suffix, so group names stay
# short. Configuration cannot bound every title, though: a group with a single
# update names the dependency and both versions ("chore(deps): bump
# nginxinc/nginx-unprivileged from 1.30-alpine to 1.31-alpine in /web in the
# docker group"), and the actions group adds "across 1 directory". A
# maintainer shortens such a title to a valid header before merging (see
# "Commits & merging" in AGENTS.md); the pr-title check reruns on the edit.

version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
        # reqwest updates arrive as their own pull requests, so one the e2e
        # crate cannot take never blocks the rest of the group. tests/e2e
        # stays on the reqwest line spargen's generated client supports (see
        # tests/e2e/Cargo.toml), whatever the workspace's reqwest moves to.
        exclude-patterns: ["reqwest"]
      sec:
        applies-to: security-updates
        patterns: ["*"]

  # The bun ecosystem reads and writes bun.lock; the npm one does not.
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    groups:
      bun:
        applies-to: version-updates
        patterns: ["*"]
      sec:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /web/contract
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    groups:
      bun:
        applies-to: version-updates
        patterns: ["*"]
      sec:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    groups:
      bun:
        applies-to: version-updates
        patterns: ["*"]
      sec:
        applies-to: security-updates
        patterns: ["*"]

  # Base images are pinned as `tag@sha256:<multi-arch index>`; Dependabot
  # refreshes the digest and proposes newer tags. One entry per directory: a
  # group across directories gets a title too long for the 72-character rule.
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      # The Rust image's tag follows rust-toolchain.toml, which is bumped by
      # hand together with every crate's rust-version and clippy.toml's msrv;
      # only its digest is refreshed here.
      - dependency-name: "*rust"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
