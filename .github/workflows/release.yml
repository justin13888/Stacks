# Release automation (see AGENTS.md "Commits & merging" and
# docs/adr/0001-release-signing.md).
#
# On every push to master, release-please opens or updates the release PR
# from the Conventional Commits since the last release. Merging that PR cuts
# the release: release-please tags the (GitHub-signed) squash commit and
# publishes the GitHub Release, then this workflow publishes multi-arch GHCR
# images with SBOMs and build-provenance attestations, plus attested release
# assets (openapi.json, the compose bundle, SHA256SUMS).
#
# Auth is GITHUB_TOKEN only: no PAT, no personal signing key.
#
# On a pull request that touches the release machinery, the publish jobs run
# as a dry run: everything is built, nothing is pushed, attested or uploaded
# to a release.
name: Release

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - release-please-config.json
      - .release-please-manifest.json
      - api/Dockerfile
      - web/Dockerfile

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # Publish only for a real release; a pull request is a dry run.
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please labels the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A GITHUB_TOKEN push triggers no workflow, so the release PR would never
  # get CI. Bring its lockfiles in line with the bumped versions, then
  # dispatch CI on the release branch so `ci-ok` reports on its head SHA.
  release-pr:
    name: Release PR lockfiles + CI
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v2
      - name: Sync lockfiles
        run: just sync-lockfiles
      - name: Commit lockfile changes
        run: |
          # web/openapi.json carries the version as info.version.
          if git diff --quiet -- Cargo.lock web/bun.lock web/openapi.json; then
            echo "Lockfiles and the OpenAPI document already match the release versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): sync lockfiles with the release version" -- Cargo.lock web/bun.lock web/openapi.json
          git push origin "HEAD:refs/heads/${BRANCH}"
      - name: Run CI on the release branch
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  # Each platform builds on a runner of its own architecture (no QEMU), and
  # a release pushes it by digest only; `images` then joins the two into the
  # tagged multi-arch index. A dry run builds both and pushes nothing.
  image-builds:
    name: Image (${{ matrix.image }}, ${{ matrix.arch }})
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/stacks-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Labels only: the tags go on the index `images` creates.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}-${{ matrix.arch }}
      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  images:
    name: Image (${{ matrix.image }})
    needs: [release-please, image-builds]
    if: ${{ !cancelled() && needs.image-builds.result == 'success' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/stacks-${{ matrix.image }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # vX.Y.Z, X.Y and latest.
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      # The per-platform indexes carry their SBOM and provenance manifests,
      # which the joined index keeps.
      - name: Create the multi-arch index
        id: index
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # One file per platform, named after its digest.
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  assets:
    name: Release assets
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # A dry run has no tag; name the bundle after the commit instead.
      TAG: ${{ needs.release-please.outputs.tag_name || format('dry-run-{0}', github.sha) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Build openapi.json, compose bundle and SHA256SUMS
        run: just release-assets "$TAG" dist
      - uses: actions/attest-build-provenance@v4
        if: env.PUBLISH == 'true'
        with:
          subject-path: dist/*
      - name: Upload to the GitHub Release
        if: env.PUBLISH == 'true'
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Keep dry-run assets as a workflow artifact
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-dry-run
          path: dist/
