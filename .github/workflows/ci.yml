name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # --- Rust (api + core) ---
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check (api)
        run: cargo fmt --manifest-path api/Cargo.toml --check
      - name: Format check (core)
        run: cargo fmt --manifest-path core/Cargo.toml --check
      - name: Lint (api)
        run: cargo clippy --manifest-path api/Cargo.toml -- -D warnings
      - name: Lint (core)
        run: cargo clippy --manifest-path core/Cargo.toml -- -D warnings
      - name: Test (api)
        run: cargo test --manifest-path api/Cargo.toml
      - name: Test (core)
        run: cargo test --manifest-path core/Cargo.toml

  # --- Web ---
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: cd web && bun install
      - name: Format check
        run: cd web && bun run format
      - name: Lint
        run: cd web && bun run lint
      - name: Type check
        run: cd web && bun run check
      - name: Test
        run: cd web && bun test

  # --- Coverage (Rust) ---
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (api)
        run: cargo llvm-cov --manifest-path api/Cargo.toml --lcov --output-path lcov-api.info
      - name: Coverage (core)
        run: cargo llvm-cov --manifest-path core/Cargo.toml --lcov --output-path lcov-core.info
