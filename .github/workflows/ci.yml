name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Every command goes through `just` (see Justfile). Keep recipe changes there;
# this workflow should just orchestrate runners + toolchains.

jobs:
  # --- Rust (api + core) ---
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Format check (api)
        run: just format-check-api
      - name: Format check (core)
        run: just format-check-core
      - name: Lint (api)
        run: just lint-api
      - name: Lint (core)
        run: just lint-core
      - name: Test (api)
        run: just test-api
      - name: Test (core)
        run: just test-core
      - name: OpenAPI spec generates cleanly
        run: just gen-openapi > /tmp/openapi.json
      - name: Validate OpenAPI is valid JSON
        run: python3 -c "import json; json.load(open('/tmp/openapi.json'))"

  # --- Web ---
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v2
      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Format check
        run: just format-check-web
      - name: Lint
        run: just lint-web
      # typecheck/test/build all depend on the `codegen` recipe, which needs the
      # Rust toolchain to emit the OpenAPI spec the orval client is built from.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Type check
        run: just typecheck-web
      - name: Test
        run: just test-web
      - name: Build
        run: just build-web

  # --- Coverage (Rust) ---
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Enforce the ratchet, then emit lcov for the artifact. CI previously
      # called only the lcov recipes, so the threshold in `coverage-*` never ran.
      - name: Coverage gate (api)
        run: just coverage-api
      - name: Coverage gate (core)
        run: just coverage-core
      - name: Coverage report (api)
        run: just coverage-lcov-api
      - name: Coverage report (core)
        run: just coverage-lcov-core
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            lcov-api.info
            lcov-core.info

  # --- Security scanning ---
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny
        run: just audit-deny
      - name: cargo audit
        run: just audit-vuln

  # --- Docker image build verification ---
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: stacks-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: stacks-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
