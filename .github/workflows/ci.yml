name: CI

on:
  push:
    branches: [master]
  pull_request:
    # `edited` re-checks the title, which becomes the squash commit on master.
    # An edit runs only the title check; see the edit concurrency group below
    # and ci-ok's carry-forward step.
    types: [opened, edited, synchronize, reopened]
  # The release workflow dispatches CI on the release-please branch: pushes
  # made with GITHUB_TOKEN trigger no workflows, so without this the release
  # PR would never get a `ci-ok` check.
  workflow_dispatch:

# A title or body edit runs in its own group, so it never cancels the full
# run of the same head.
#
# Each push to master gets a group of its own (its SHA). A group holds one
# running and one pending run, and a newer pending run cancels the older one
# whatever `cancel-in-progress` says; a shared master group would therefore
# drop a queued push's run, and with it the only lint of that push's commits
# (`commits` lints `before..sha` of its own push). ci-ok checks this.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'edit' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # mise.toml pins every tool; each job installs only the ones it needs
  # (mise-action's install_args), so `mise run` must not install the rest.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

# Every command goes through `mise run` (see mise.toml). Keep task changes
# there; this workflow should only orchestrate runners + toolchains.

jobs:
  # --- Commit messages (rule: .versionrc + `mise run commit-lint`) ---
  # Every merge is a squash, so the PR title is the commit that lands.
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: "github:convco/convco"
      # The squash header GitHub writes is the title plus " (#N)", and that
      # header is what the master push lint and the 72-character cap see.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" > "$RUNNER_TEMP/pr-title"
          mise run commit-lint "$RUNNER_TEMP/pr-title"

  # A PR's own commits are not linted: the squash discards them, and a bad
  # one could only be cleared by rewriting published history. What lands on
  # master is linted on push instead, so no commit reaches it unchecked.
  commits:
    name: Commit messages
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: "github:convco/convco"
      - name: commit-lint self-test
        run: mise run commit-lint:test
      # An all-zero `before` means the branch was just created: no range.
      - name: Lint every commit pushed to master
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: mise run commit-lint:range "$BEFORE_SHA" "$HEAD_SHA"

  # --- File length (scripts/check-file-length) ---
  # Against the base, so the allow-list can only shrink.
  file-length:
    name: File length
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install: false
      - name: check-file-length self-test
        run: mise run check:file-length-test
      # The pull request's base, or the previous master head on a push; an
      # all-zero `before` (a new branch) and a dispatch have no base.
      - name: Every file is within its package's limit
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha ||
            (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: mise run check:file-length "$BASE_SHA"

  # --- Rust (api + core) ---
  rust:
    name: Rust
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the exact release and its components.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
        with:
          install: false
      - name: Format check (api)
        run: mise run format-check:api
      - name: Format check (core)
        run: mise run format-check:core
      - name: Format check (e2e)
        run: mise run format-check:e2e
      - name: Lint (api)
        run: mise run lint:api
      - name: Lint (core)
        run: mise run lint:core
      - name: Lint (e2e)
        run: mise run lint:e2e
      - name: Test (api)
        run: mise run test:api
      - name: Test (core)
        run: mise run test:core
      # A Rust client spargen generates from the committed web/openapi.json,
      # driving a real server through a whole journey.
      - name: Test (e2e)
        run: mise run test:e2e
      - name: Committed OpenAPI document is current
        run: mise run check:openapi

  # --- Web ---
  web:
    name: Web
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun
      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Format check
        run: mise run format-check:web
      - name: Lint
        run: mise run lint:web
      # typecheck/test/build run orval over the committed web/openapi.json,
      # so this job needs no Rust toolchain.
      - name: Type check
        run: mise run typecheck:web
      - name: Test
        run: mise run test:web
      - name: Build
        run: mise run build:web
      # The Playwright suite's own code (e2e/); it runs in the E2E job.
      - name: Install browser suite dependencies
        run: cd e2e && bun install --frozen-lockfile
      - name: Format check (browser suite)
        run: mise run format-check:browser
      - name: Lint (browser suite)
        run: mise run lint:browser
      - name: Type check (browser suite)
        run: mise run typecheck:browser
      - name: Every configuration variable is documented
        run: mise run check:env-docs
      - name: The compose files keep their deployment properties
        run: mise run check:compose

  # --- OpenAPI contract harness (docs/adr/0002-openapi-31-kynos-orval.md) ---
  # kynos 3.1 export -> orval 8 client -> strict tsc -> Vitest round trip.
  contract:
    name: Contract
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
        with:
          install_args: bun
      - name: Install dependencies
        run: cd web/contract && bun install --frozen-lockfile
      - name: Contract
        run: mise run contract

  # --- Coverage (Rust) ---
  coverage:
    name: Coverage
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml lists llvm-tools-preview among its components.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
        with:
          install_args: "aqua:taiki-e/cargo-llvm-cov"
      # Enforce the 80% line gate (the job's DATABASE_URL runs the DB-backed
      # tests), then emit lcov for the artifact. Only the `coverage:*`
      # tasks carry the threshold; the `coverage-lcov:*` ones only report.
      - name: Coverage gate (api)
        run: mise run coverage:api
      - name: Coverage gate (core)
        run: mise run coverage:core
      - name: Coverage report (api)
        run: mise run coverage-lcov:api
      - name: Coverage report (core)
        run: mise run coverage-lcov:core
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: |
            lcov-api.info
            lcov-core.info

  # --- Security scanning ---
  audit:
    name: Security audit
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
        with:
          install_args: cargo-deny "aqua:rustsec/rustsec/cargo-audit"
      - name: cargo deny
        run: mise run audit:deny
      - name: cargo audit
        run: mise run audit:vuln

  # --- Images + the composed stack, end to end (docs/QA.md) ---
  # Builds both images (amd64 only: the multi-arch build is release.yml's),
  # boots compose.yaml + compose.build.yaml + e2e/compose.e2e.yaml with Dex
  # and the metadata fixtures, waits for every service to report healthy,
  # runs the Playwright journey, screens and outage drills, then proves the
  # backup sidecar's dump restores. Screenshots of every main screen in both
  # themes are uploaded for review.
  e2e:
    name: E2E (composed stack)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The runner has docker, not podman (scripts/compose).
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun
      - uses: docker/setup-buildx-action@v4
      # Tagged as compose.build.yaml names them, so `up --no-build` uses them.
      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: localhost/stacks-api:dev
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: localhost/stacks-web:dev
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # `--wait` fails unless every service reports healthy.
      - name: Start the stack and wait for every service to be healthy
        run: mise run e2e:up "--no-build --wait --wait-timeout 300"
      - name: Install the browser suite
        run: mise run e2e:install --with-deps
      - name: Playwright
        env:
          CI: "true"
        run: mise run e2e
      - name: Backup sidecar dump restores row for row
        run: mise run backup:verify
      - name: Stack logs
        if: failure()
        run: |
          mkdir -p e2e/artifacts
          mise run e2e:logs > e2e/artifacts/stack.log 2>&1 || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/artifacts/screenshots
          if-no-files-found: ignore
      - name: Upload report, traces and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/artifacts/stack.log
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: mise run e2e:down

  # --- Aggregate ---
  # The one check the master ruleset requires. It must `need` every other job
  # in this file: add new jobs here too. `skipped` passes because pr-title only
  # runs on pull_request and every other job skips on an edit; anything else
  # (failure, cancelled) fails. `commits` runs on every other event: the
  # task self-test always, the range on push.
  #
  # An edit's run checks only the title, so its ci-ok must not pass on jobs
  # it skipped: it carries forward the verdict of the latest full run of the
  # same head, waiting while that run is unfinished. It never fails for an
  # unfinished run: GitHub would keep that failed ci-ok as the head's verdict
  # even after the full run's own ci-ok passed.
  ci-ok:
    name: ci-ok
    if: always()
    # Room for the edit path's wait on a full run (its bound is 80 minutes).
    timeout-minutes: 90
    needs: [pr-title, commits, file-length, rust, web, contract, coverage, audit, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: ci-ok needs every other job
        run: |
          diff \
            <(yq -r '.jobs | keys | .[] | select(. != "ci-ok")' .github/workflows/ci.yml | sort) \
            <(yq -r '.jobs["ci-ok"].needs[]' .github/workflows/ci.yml | sort)
      # See the comment on `concurrency`: a shared group would cancel queued
      # master pushes, and their commits would never be linted.
      - name: Every master push runs in a concurrency group of its own
        run: |
          group="$(yq -r '.concurrency.group' .github/workflows/ci.yml)"
          case "$group" in
            *"github.event_name == 'push' && github.sha ||"*) ;;
            *)
              echo "::error::concurrency.group must key master pushes on their SHA: $group"
              exit 1
              ;;
          esac
      - name: Every required job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
      - name: On an edit, carry forward the full run's verdict
        if: github.event.action == 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          # A failing ci-ok here would outlive the full run's passing one and
          # keep blocking the merge, so while the full run is unfinished this
          # step waits for it instead of failing. The bound sits inside the
          # job's timeout-minutes; past it the step fails and says why.
          deadline=$(( $(date +%s) + 80 * 60 ))
          while :; do
            # The latest run of this workflow on the head that ran the full
            # set: its Rust check run did not skip. The run id comes from the
            # details URL: .../actions/runs/RUN/job/JOB.
            full="$(gh api --paginate "repos/${REPO}/commits/${HEAD_SHA}/check-runs?check_name=Rust&per_page=100" \
              --jq '.check_runs[] | select(.conclusion != "skipped") | (try ((.details_url // "") | capture("/actions/runs/(?<id>[0-9]+)/").id) catch empty)' \
              | grep -vx "$THIS_RUN" | sort -n | tail -n 1 || true)"
            if [ -n "$full" ]; then
              # The full run's own status covers exactly the jobs that run
              # has, whatever this run's ci.yml lists.
              [ "$(gh api "repos/${REPO}/actions/runs/${full}" --jq .status)" = completed ] && break
              waiting="full run ${full} to finish"
            else
              waiting="a full CI run of ${HEAD_SHA} to start"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Gave up waiting for ${waiting}; re-run this job once it has."
              exit 1
            fi
            echo "Waiting for ${waiting}."
            sleep 30
          done
          # The verdict is the full run's latest-attempt jobs minus its PR
          # title and ci-ok: an edit exists to fix the title, and a re-run of
          # the full run would replay the old one, so its failed title (and
          # the ci-ok that failed with it) must not decide this one. This
          # run's own title check passed in the step above.
          jobs="$(gh api --paginate "repos/${REPO}/actions/runs/${full}/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name != "PR title" and .name != "ci-ok") | "\(.name): \(.conclusion)"')"
          echo "$jobs"
          failed="$(grep -Ev ': (success|skipped)$' <<< "$jobs" || true)"
          if [ -z "$jobs" ] || [ -n "$failed" ]; then
            echo "::error::Full run ${full} did not pass:"
            echo "${failed:-no jobs reported}"
            exit 1
          fi
          echo "Full run ${full} passed; the title check passed above."
