name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Rust (api + core) ---
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check (api)
        run: cargo fmt --manifest-path api/Cargo.toml --check
      - name: Format check (core)
        run: cargo fmt --manifest-path core/Cargo.toml --check
      - name: Lint (api)
        run: cargo clippy --manifest-path api/Cargo.toml --all-targets -- -D warnings
      - name: Lint (core)
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Test (api)
        run: cargo test --manifest-path api/Cargo.toml
      - name: Test (core)
        run: cargo test --manifest-path core/Cargo.toml
      - name: OpenAPI spec generates cleanly
        run: cargo run --manifest-path api/Cargo.toml --bin gen-openapi > /tmp/openapi.json
      - name: Validate OpenAPI is valid JSON
        run: python3 -c "import json; json.load(open('/tmp/openapi.json'))"

  # --- Web ---
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Format check
        run: cd web && bun run format
      - name: Lint
        run: cd web && bun run lint
      # The web typecheck needs the orval client, which needs the spec; spin up
      # just enough Rust to generate it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate API client
        run: |
          cargo run --manifest-path api/Cargo.toml --bin gen-openapi > web/openapi.json
          cd web && bun run codegen
      - name: Type check
        run: cd web && bun run check
      - name: Test
        run: cd web && bun test
      - name: Build
        run: cd web && bun run build

  # --- Coverage (Rust) ---
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (api)
        run: cargo llvm-cov --manifest-path api/Cargo.toml --lcov --output-path lcov-api.info
      - name: Coverage (core)
        run: cargo llvm-cov --manifest-path core/Cargo.toml --lcov --output-path lcov-core.info
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            lcov-api.info
            lcov-core.info

  # --- Security scanning ---
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        # Audit surfaces yanked + advisories; don't fail the build for now,
        # but make findings visible in logs.
        run: cargo audit || true

  # --- Docker image build verification ---
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: stacks-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: stacks-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
