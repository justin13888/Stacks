name: CI

on:
  push:
    branches: [master]
  pull_request:
    # `edited` re-checks the title, which becomes the squash commit on master.
    types: [opened, edited, synchronize, reopened]
  # The release workflow dispatches CI on the release-please branch: pushes
  # made with GITHUB_TOKEN trigger no workflows, so without this the release
  # PR would never get a `ci-ok` check.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every command goes through `just` (see Justfile). Keep recipe changes there;
# this workflow should just orchestrate runners + toolchains.

jobs:
  # --- Commit messages (rule: .versionrc + `just commit-lint`) ---
  # Every merge is a squash, so the PR title is the commit that lands.
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: convco@0.7.2
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          just commit-lint "$RUNNER_TEMP/pr-title"

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: convco@0.7.2
      - name: commit-lint self-test
        run: just commit-lint-test
      - name: Lint every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: just commit-lint-range "$BASE_SHA" "$HEAD_SHA"

  # --- Rust (api + core) ---
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the exact release and its components.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Format check (api)
        run: just format-check-api
      - name: Format check (core)
        run: just format-check-core
      - name: Format check (e2e)
        run: just format-check-e2e
      - name: Lint (api)
        run: just lint-api
      - name: Lint (core)
        run: just lint-core
      - name: Lint (e2e)
        run: just lint-e2e
      - name: Test (api)
        run: just test-api
      - name: Test (core)
        run: just test-core
      # A Rust client spargen generates from the committed web/openapi.json,
      # driving a real server through a whole journey.
      - name: Test (e2e)
        run: just test-e2e
      - name: Committed OpenAPI document is current
        run: just check-openapi

  # --- Web ---
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v2
      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Format check
        run: just format-check-web
      - name: Lint
        run: just lint-web
      # typecheck/test/build run orval over the committed web/openapi.json,
      # so this job needs no Rust toolchain.
      - name: Type check
        run: just typecheck-web
      - name: Test
        run: just test-web
      - name: Build
        run: just build-web

  # --- OpenAPI contract harness (docs/adr/0002-openapi-31-kynos-orval.md) ---
  # kynos 3.1 export -> orval 8 client -> strict tsc -> Vitest round trip.
  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v2
      - name: Install dependencies
        run: cd web/contract && bun install --frozen-lockfile
      - name: Contract
        run: just contract

  # --- Coverage (Rust) ---
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml lists llvm-tools-preview among its components.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Enforce the ratchet, then emit lcov for the artifact. CI previously
      # called only the lcov recipes, so the threshold in `coverage-*` never ran.
      - name: Coverage gate (api)
        run: just coverage-api
      - name: Coverage gate (core)
        run: just coverage-core
      - name: Coverage report (api)
        run: just coverage-lcov-api
      - name: Coverage report (core)
        run: just coverage-lcov-core
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            lcov-api.info
            lcov-core.info

  # --- Security scanning ---
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny
        run: just audit-deny
      - name: cargo audit
        run: just audit-vuln

  # --- Docker image build verification ---
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: stacks-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: stacks-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # --- Aggregate ---
  # The one check the master ruleset requires. It must `need` every other job
  # in this file: add new jobs here too. `skipped` passes because pr-title and
  # commits only run on pull_request; anything else (failure, cancelled) fails.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [pr-title, commits, rust, web, contract, coverage, audit, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: ci-ok needs every other job
        run: |
          diff \
            <(yq -r '.jobs | keys | .[] | select(. != "ci-ok")' .github/workflows/ci.yml | sort) \
            <(yq -r '.jobs["ci-ok"].needs[]' .github/workflows/ci.yml | sort)
      - name: Every required job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
