name: CI

on:
  push:
    branches: [master]
  pull_request:
    # `edited` re-checks the title, which becomes the squash commit on master.
    # An edit runs only the title check; see the edit concurrency group below
    # and ci-ok's carry-forward step.
    types: [opened, edited, synchronize, reopened]
  # The release workflow dispatches CI on the release-please branch: pushes
  # made with GITHUB_TOKEN trigger no workflows, so without this the release
  # PR would never get a `ci-ok` check.
  workflow_dispatch:

# A title or body edit runs in its own group, so it never cancels the full
# run of the same head (an edit used to restart every job).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'edit' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every command goes through `just` (see Justfile). Keep recipe changes there;
# this workflow should just orchestrate runners + toolchains.

jobs:
  # --- Commit messages (rule: .versionrc + `just commit-lint`) ---
  # Every merge is a squash, so the PR title is the commit that lands.
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: convco@0.7.2
      # The squash header GitHub writes is the title plus " (#N)", and that
      # header is what the master push lint and the 72-character cap see.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" > "$RUNNER_TEMP/pr-title"
          just commit-lint "$RUNNER_TEMP/pr-title"

  # A PR's own commits are not linted: the squash discards them, and a bad
  # one could only be cleared by rewriting published history. What lands on
  # master is linted on push instead, so no commit reaches it unchecked.
  commits:
    name: Commit messages
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: convco@0.7.2
      - name: commit-lint self-test
        run: just commit-lint-test
      # An all-zero `before` means the branch was just created: no range.
      - name: Lint every commit pushed to master
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: just commit-lint-range "$BEFORE_SHA" "$HEAD_SHA"

  # --- File length (scripts/check-file-length) ---
  # Against the base, so the allow-list can only shrink.
  file-length:
    name: File length
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      # The pull request's base, or the previous master head on a push; an
      # all-zero `before` (a new branch) and a dispatch have no base.
      - name: Every file is within its package's limit
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha ||
            (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: just check-file-length "$BASE_SHA"

  # --- Rust (api + core) ---
  rust:
    name: Rust
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the exact release and its components.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Format check (api)
        run: just format-check-api
      - name: Format check (core)
        run: just format-check-core
      - name: Format check (e2e)
        run: just format-check-e2e
      - name: Lint (api)
        run: just lint-api
      - name: Lint (core)
        run: just lint-core
      - name: Lint (e2e)
        run: just lint-e2e
      - name: Test (api)
        run: just test-api
      - name: Test (core)
        run: just test-core
      # A Rust client spargen generates from the committed web/openapi.json,
      # driving a real server through a whole journey.
      - name: Test (e2e)
        run: just test-e2e
      - name: Committed OpenAPI document is current
        run: just check-openapi

  # --- Web ---
  web:
    name: Web
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v2
      - name: Install dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Format check
        run: just format-check-web
      - name: Lint
        run: just lint-web
      # typecheck/test/build run orval over the committed web/openapi.json,
      # so this job needs no Rust toolchain.
      - name: Type check
        run: just typecheck-web
      - name: Test
        run: just test-web
      - name: Build
        run: just build-web
      # The Playwright suite's own code (e2e/); it runs in the E2E job.
      - name: Install browser suite dependencies
        run: cd e2e && bun install --frozen-lockfile
      - name: Format check (browser suite)
        run: just format-check-browser
      - name: Lint (browser suite)
        run: just lint-browser
      - name: Type check (browser suite)
        run: just typecheck-browser
      - name: Every configuration variable is documented
        run: just check-env-docs

  # --- OpenAPI contract harness (docs/adr/0002-openapi-31-kynos-orval.md) ---
  # kynos 3.1 export -> orval 8 client -> strict tsc -> Vitest round trip.
  contract:
    name: Contract
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v2
      - name: Install dependencies
        run: cd web/contract && bun install --frozen-lockfile
      - name: Contract
        run: just contract

  # --- Coverage (Rust) ---
  coverage:
    name: Coverage
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacks_test
          POSTGRES_USER: stacks
          POSTGRES_PASSWORD: stacks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stacks:stacks@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml lists llvm-tools-preview among its components.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Enforce the ratchet, then emit lcov for the artifact. CI previously
      # called only the lcov recipes, so the threshold in `coverage-*` never ran.
      - name: Coverage gate (api)
        run: just coverage-api
      - name: Coverage gate (core)
        run: just coverage-core
      - name: Coverage report (api)
        run: just coverage-lcov-api
      - name: Coverage report (core)
        run: just coverage-lcov-core
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            lcov-api.info
            lcov-core.info

  # --- Security scanning ---
  audit:
    name: Security audit
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny
        run: just audit-deny
      - name: cargo audit
        run: just audit-vuln

  # --- Images + the composed stack, end to end (docs/QA.md) ---
  # Builds both images (amd64 only: the multi-arch build is release.yml's),
  # boots compose.yaml + compose.build.yaml + e2e/compose.e2e.yaml with Dex
  # and the metadata fixtures, waits for every service to report healthy,
  # runs the Playwright journey, screens and outage drills, then proves the
  # backup sidecar's dump restores. Screenshots of every main screen in both
  # themes are uploaded for review.
  e2e:
    name: E2E (composed stack)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v2
      - uses: docker/setup-buildx-action@v3
      # Tagged as compose.build.yaml names them, so `up --no-build` uses them.
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: localhost/stacks-api:dev
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: localhost/stacks-web:dev
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # `--wait` fails unless every service reports healthy.
      - name: Start the stack and wait for every service to be healthy
        run: just container_engine=docker e2e-up "--no-build --wait --wait-timeout 300"
      - name: Install the browser suite
        run: just e2e-install --with-deps
      - name: Playwright
        env:
          CI: "true"
        run: just container_engine=docker e2e
      - name: Backup sidecar dump restores row for row
        run: just container_engine=docker backup-verify
      - name: Stack logs
        if: failure()
        run: |
          mkdir -p e2e/artifacts
          just container_engine=docker e2e-logs > e2e/artifacts/stack.log 2>&1 || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/artifacts/screenshots
          if-no-files-found: ignore
      - name: Upload report, traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/artifacts/stack.log
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: just container_engine=docker e2e-down

  # --- Aggregate ---
  # The one check the master ruleset requires. It must `need` every other job
  # in this file: add new jobs here too. `skipped` passes because pr-title only
  # runs on pull_request and every other job skips on an edit; anything else
  # (failure, cancelled) fails. `commits` runs on every other event: the
  # recipe self-test always, the range on push.
  #
  # An edit's run checks only the title, so its ci-ok must not pass on jobs
  # it skipped: it carries forward the verdict of the latest full run of the
  # same head, and fails while that run is unfinished (the full run's own
  # ci-ok reports once it is).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [pr-title, commits, file-length, rust, web, contract, coverage, audit, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: ci-ok needs every other job
        run: |
          diff \
            <(yq -r '.jobs | keys | .[] | select(. != "ci-ok")' .github/workflows/ci.yml | sort) \
            <(yq -r '.jobs["ci-ok"].needs[]' .github/workflows/ci.yml | sort)
      - name: Every required job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
      - name: On an edit, carry forward the full run's verdict
        if: github.event.action == 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          # Every check run on the head, tagged with the workflow run it
          # belongs to (from its details URL: .../actions/runs/RUN/job/JOB).
          checks="$(gh api --paginate "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, status, conclusion, run: (try ((.details_url // "") | capture("/actions/runs/(?<id>[0-9]+)/").id) catch null)}' \
            | jq -s .)"
          # The latest run of this workflow on the head that ran the full
          # set: its Rust job did not skip.
          full="$(jq -r --arg me "$THIS_RUN" '
            [.[] | select(.run != null and .run != $me and .name == "Rust" and .conclusion != "skipped")
                 | .run | tonumber] | max // empty' <<< "$checks")"
          if [ -z "$full" ]; then
            echo "::error::No full CI run exists for ${HEAD_SHA}; push or re-run CI on it."
            exit 1
          fi
          jobs="$(jq --arg run "$full" '[.[] | select(.run == $run and .name != "ci-ok" and .name != "PR title")]' <<< "$checks")"
          pending="$(jq -r '.[] | select(.status != "completed") | .name' <<< "$jobs")"
          if [ -n "$pending" ]; then
            echo "::error::Full run ${full} is still running (${pending//$'\n'/, }); its own ci-ok reports when it finishes."
            exit 1
          fi
          failed="$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name): \(.conclusion)"' <<< "$jobs")"
          if [ -n "$failed" ]; then
            echo "::error::Full run ${full} did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "Full run ${full} passed; the title check passed above."
          jq -r '.[] | "\(.name): \(.conclusion)"' <<< "$jobs"
