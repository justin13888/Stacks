server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every non-asset path serves index.html so client-side
    # routing (TanStack Router) handles deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API under the same origin as the app.
    #
    # Without this the SPA's relative /api/... calls fall through to the SPA
    # fallback above and receive index.html, so the containerised app could not
    # reach the backend at all. Same-origin also means no CORS preflight and no
    # build-time API URL to bake in (Vite inlines env at build time, so setting
    # VITE_API_BASE_URL on this container at runtime would do nothing).
    location /api/ {
        proxy_pass http://stacks-api:8095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API's rate limiter keys on the first hop of X-Forwarded-For.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Import and backup uploads are multipart files, larger than the 1m
        # default.
        client_max_body_size 32m;
    }

    # Aggressive caching for fingerprinted Vite assets.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry document so users get new bundle hashes on deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The service worker and the PWA manifest are revalidated on every load,
    # so a deploy replaces the offline shell instead of pinning the old one.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Block direct access to source maps in production.
    location ~ \.map$ {
        deny all;
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
