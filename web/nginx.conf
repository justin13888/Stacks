server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every non-asset path serves index.html so client-side
    # routing (TanStack Router) handles deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for fingerprinted Vite assets.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry document so users get new bundle hashes on deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Block direct access to source maps in production.
    location ~ \.map$ {
        deny all;
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
