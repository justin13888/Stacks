<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Stacks</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4f3bd6"/>
    </linearGradient>
  </defs>
  <!-- Full bleed; the mark stays inside the 80% safe zone. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="160" y="166" width="192" height="44" rx="22" fill="#fff" fill-opacity="0.55"/>
  <rect x="160" y="234" width="192" height="44" rx="22" fill="#fff" fill-opacity="0.8"/>
  <rect x="160" y="302" width="192" height="44" rx="22" fill="#fff"/>
</svg>
