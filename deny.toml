# cargo-deny configuration — run with `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Fail on any unaddressed advisory; known/unfixable ones are listed here with
# the reason they cannot be actioned from this repository.
yanked = "deny"
ignore = [
    # The Marvin attack recovers an RSA *private* key from the timing of
    # operations that use it (decryption, signing). `rsa` reaches Stacks only
    # through openidconnect, which uses it to verify identity providers'
    # id_token signatures with their public keys; Stacks holds no RSA private
    # key and performs no private-key operation. No patched release exists.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for public-key signature verification only (openidconnect id_tokens)" },
    # proc-macro-error2 is unmaintained. It is a build-time proc-macro helper
    # of sea-orm's derive macros (sea-orm-macros -> sea-bae) and never reaches
    # the running binary. Revisit when sea-orm moves off it.
    { id = "RUSTSEC-2026-0173", reason = "build-time only, via sea-orm-macros; no maintained release to move to" },
    # crypto-bigint 0.5 has secret-dependent branches in operations meant to be
    # constant-time; the leak matters only for arithmetic on secret integers.
    # It reaches Stacks only through openidconnect -> p256/p384 ->
    # elliptic-curve 0.13, used to verify identity providers' ES256/ES384
    # id_token signatures with their public keys; Stacks holds no EC private
    # key. The fix is in crypto-bigint 0.7, which elliptic-curve 0.13 cannot
    # take, and openidconnect 4.0.1 (latest) still pins p256/p384 0.13.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint is used for public-key ECDSA verification only (openidconnect id_tokens); fix needs elliptic-curve 0.14, which openidconnect has not adopted" },
]

[licenses]
# AGPL-3.0 codebase — allowed inbound licenses are the usual permissive set
# plus copyleft variants that remain compatible.
allow = [
    # This workspace's own crates.
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # MIT without the attribution clause (borrow-or-share, via kynos's test
    # utilities): strictly more permissive than MIT.
    "MIT-0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    # webpki-roots ships Mozilla's CA certificate bundle under a permissive
    # data licence; it imposes no obligations that conflict with AGPL.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace `path` deps legitimately carry no version requirement; the
# wildcard ban is aimed at crates.io deps.
allow-wildcard-paths = true
highlight = "all"

# Workspace crates can be allowed to appear multiple times.
[[bans.skip]]
name = "syn"
[[bans.skip]]
name = "windows-sys"
[[bans.skip]]
name = "hashbrown"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
