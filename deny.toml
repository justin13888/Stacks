# cargo-deny configuration — run with `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Fail on any unaddressed advisory; known/unfixable ones are listed here with
# the reason they cannot be actioned from this repository.
yanked = "deny"
ignore = [
    # All three reach us only through salvo's dependency tree and have no
    # patched release to move to. Revisit when salvo updates.
    # proc-macro-error2: unmaintained, pulled in by salvo's macro crates.
    "RUSTSEC-2025-0134",
    # rustls-pemfile: unmaintained, pulled in by salvo_core.
    "RUSTSEC-2026-0173",
    # spin 0.9.8 was yanked upstream and multer -> salvo_core still requires it.
    # There is no non-yanked version in range to move to.
    { crate = "spin@0.9.8", reason = "yanked; required by multer via salvo_core" },
]

[licenses]
# AGPL-3.0 codebase — allowed inbound licenses are the usual permissive set
# plus copyleft variants that remain compatible.
allow = [
    # This workspace's own crates.
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    # webpki-roots ships Mozilla's CA certificate bundle under a permissive
    # data licence; it imposes no obligations that conflict with AGPL.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace `path` deps legitimately carry no version requirement; the
# wildcard ban is aimed at crates.io deps.
allow-wildcard-paths = true
highlight = "all"

# Workspace crates can be allowed to appear multiple times.
[[bans.skip]]
name = "syn"
[[bans.skip]]
name = "windows-sys"
[[bans.skip]]
name = "windows_x86_64_gnu"
[[bans.skip]]
name = "hashbrown"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
