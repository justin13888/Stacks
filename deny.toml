# cargo-deny configuration — run with `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Fail on any unaddressed advisory; we explicitly list known/unfixable ones.
yanked = "deny"
ignore = []

[licenses]
# AGPL-3.0 codebase — allowed inbound licenses are the usual permissive set
# plus copyleft variants that remain compatible.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Workspace crates can be allowed to appear multiple times.
[[bans.skip]]
name = "syn"
[[bans.skip]]
name = "windows-sys"
[[bans.skip]]
name = "windows_x86_64_gnu"
[[bans.skip]]
name = "hashbrown"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
# cameo lives at a known fork until it ships to crates.io.
allow-git = ["https://github.com/justin13888/cameo"]
