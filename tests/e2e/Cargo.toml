[package]
name = "stacks-e2e"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.100"
description = "Black-box journeys through a Rust client spargen generates from the committed web/openapi.json."

# The library is the generated client and nothing else (see build.rs); the
# journeys in tests/ drive a real server with it.
[lib]
path = "src/lib.rs"

[dependencies]
# What spargen's generated client needs at run time, at the floors its
# generation audit requires: the workspace's reqwest major, so the lock holds
# one.
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bytes = { version = "1.12.1", features = ["serde"] }
http = "1.4.2"
http-body = "1.0.1"
url = "2.5.8"
secrecy = "0.10.3"
uuid = { version = "1.24.0", features = ["serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }

[build-dependencies]
spargen = "0.8"

[dev-dependencies]
stacks-api = { path = "../../api" }
stacks-core = { path = "../../core" }
# The API suites' harness: an ephemeral database, the mock identity provider
# and the scripted metadata provider.
stacks-test-support = { path = "../../api/tests/support" }
kynos = { workspace = true, features = ["test-util"] }
tokio = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
