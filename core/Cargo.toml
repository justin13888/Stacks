[package]
name = "stacks-core"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"
# Not published to crates.io — this is a self-hosted application, not a library.
publish = false
rust-version = "1.99"

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sea-orm = { workspace = true }
openidconnect = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
csv = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
cameo = { workspace = true }
metrics = { workspace = true }
schemars = { workspace = true }

[features]
# Service methods only tests call: shorthands over the operations the API
# uses (`#[cfg(feature = "test-support")]`). Test suites enable it through
# their dev-dependencies; no shipped build does.
test-support = []

[dev-dependencies]
# The crate's own integration tests use the test-support methods.
stacks-core = { path = ".", features = ["test-support"] }
# `test-util` gives the circuit-breaker tests a paused, steppable clock.
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
metrics-util = { workspace = true }
proptest = { workspace = true }
# DB-backed tests build each ephemeral database from the real baseline
# migration, so the schema under test is exactly the one production runs.
migration = { path = "migration" }
