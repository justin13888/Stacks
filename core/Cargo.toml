[package]
name = "stacks-core"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"
# Not published to crates.io — this is a self-hosted application, not a library.
publish = false
rust-version = "1.94"

[dependencies]
tokio = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sea-orm = { workspace = true }
jsonwebtoken = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
csv = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
cameo = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
# `test-util` gives the circuit-breaker tests a paused, steppable clock.
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
metrics-util = { workspace = true }
proptest = { workspace = true }
# DB-backed tests build each ephemeral database from the real baseline
# migration, so the schema under test is exactly the one production runs.
migration = { path = "migration" }
