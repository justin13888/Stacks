services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: stacks
      POSTGRES_USER: stacks
      POSTGRES_PASSWORD: stacks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
