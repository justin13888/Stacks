services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: stacks
      POSTGRES_USER: stacks
      # Set POSTGRES_PASSWORD before the first start: the data directory keeps
      # whatever password it was initialised with.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stacks}
    # Loopback only: the API reaches it on the compose network, and
    # `mise run dev:api` on the host reaches it here.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacks -d stacks"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
