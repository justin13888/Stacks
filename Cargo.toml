[workspace]
members = ["api", "cli", "core", "core/migration"]
exclude = ["vendor/cameo"]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "2"
eyre = "0.6"
color-eyre = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# Auth
argon2 = "0.5"
jsonwebtoken = "9"

# Crypto
aes-gcm = "0.10"
hmac = "0.12"

# IDs
ulid = "1"

# Hashing / encoding
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (for OIDC, cameo, Beam)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Import / Export
csv = "1"
quick-xml = { version = "0.36", features = ["serialize"] }

# Cameo unified TMDB/AniList SDK (justin13888/cameo)
#
# Vendored locally under `vendor/cameo` while we sit ahead of an upstream
# fix: master @ 4f35f75 has progenitor-generated TMDB types whose
# `popularity` / `vote_average` fields became `f64` while the conversion
# code still expects `Option<f64>`. We applied a small `Some(..)` wrap.
# Once upstream is fixed, this can revert to a `git = ...` dep.
#
# `cache` feature is also disabled because rusqlite's `libsqlite3-sys`
# conflicts with the version sea-orm transitively pulls in.
cameo = { path = "vendor/cameo", default-features = false, features = ["tmdb"] }
