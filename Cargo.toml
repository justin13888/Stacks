[workspace]
members = ["api", "core", "core/migration"]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
eyre = "0.6"
color-eyre = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# Auth
argon2 = "0.5"
jsonwebtoken = "9"

# Crypto
aes-gcm = "0.10"

# IDs
ulid = "1"

# Hashing / encoding
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (for OIDC, cameo, Beam)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
