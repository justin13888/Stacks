[workspace]
members = ["api", "core", "core/migration"]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Error handling
thiserror = "2"
eyre = "0.6"
color-eyre = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# Auth
argon2 = "0.5"
jsonwebtoken = "9"

# Crypto
aes-gcm = "0.10"

# IDs
ulid = "1"

# Hashing / encoding
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config & import/export formats
toml = "0.8"
csv = "1"
quick-xml = { version = "0.37", features = ["serialize"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

# HTTP client (for OIDC, cameo, Beam)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Media metadata SDK — unified TMDB + AniList access. Git dependency on master
# (not yet published to crates.io). The `cache` feature is disabled on purpose:
# it pulls `rusqlite`, whose `libsqlite3-sys` (links = "sqlite3") collides with
# the copy `sqlx` already links via SeaORM. cameo runs cache-less for now.
# Pinned to an exact rev rather than tracking `branch = "master"`: a branch
# pin lets `cargo update` silently move the dependency, so two builds of the
# same Stacks commit could differ.
cameo = { git = "https://github.com/justin13888/cameo", rev = "b638b061b408e3c5606746a5b8fa69f53debf04b", default-features = false, features = [
    "tmdb",
    "anilist",
] }
