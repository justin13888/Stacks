[workspace]
members = ["api", "core", "core/migration"]
resolver = "2"

# One version for the whole product. release-please bumps it (see
# release-please-config.json `extra-files`); never edit it by hand.
[workspace.package]
version = "0.1.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Error handling
thiserror = "2"
eyre = "0.6"
color-eyre = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database. SeaORM 2 needs Rust 1.94 (the workspace `rust-version`). Only the
# features Stacks maps are enabled: JSON (jsonb), chrono (timestamptz / date),
# UUID (every primary key) and Postgres arrays (text[] columns).
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-json",
    "with-chrono",
    "with-uuid",
    "postgres-array",
] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# Auth
jsonwebtoken = "9"

# IDs — every primary key is a UUIDv7 (time-ordered, so keyset pagination on
# `id` is also chronological).
uuid = { version = "1", features = ["v7", "serde"] }

# Hashing / encoding
base64 = "0.22"
sha2 = "0.10"
# Signs outbound notification webhooks (X-Stacks-Signature).
hmac = "0.12"
hex = "0.4"
rand = "0.9"

# Testing
proptest = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config & import/export formats
toml = "0.8"
csv = "1"
quick-xml = { version = "0.41", features = ["serialize"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

# HTTP client (for OIDC, cameo, notification channels)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Media metadata SDK — unified TMDB + AniList access. Git dependency on master
# (not yet published to crates.io). The `cache` feature is disabled on purpose:
# it pulls `rusqlite`, whose `libsqlite3-sys` (links = "sqlite3") collides with
# the copy `sqlx` already links via SeaORM. cameo runs cache-less for now.
# Pinned to an exact rev rather than tracking `branch = "master"`: a branch
# pin lets `cargo update` silently move the dependency, so two builds of the
# same Stacks commit could differ.
cameo = { git = "https://github.com/justin13888/cameo", rev = "b638b061b408e3c5606746a5b8fa69f53debf04b", default-features = false, features = [
    "tmdb",
    "anilist",
] }
