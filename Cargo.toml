[workspace]
members = ["api", "api/tests/support", "core", "core/migration", "tests/e2e"]
resolver = "2"

# One version for the whole product. release-please bumps it (see
# release-please-config.json `extra-files`); never edit it by hand.
[workspace.package]
version = "0.2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# `CancellationToken` stops the job runner on shutdown.
tokio-util = "0.7"
futures = "0.3"

# Error handling
thiserror = "2"
color-eyre = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database. Only the features Stacks maps are enabled: JSON (jsonb), chrono
# (timestamptz / date), UUID (every primary key) and Postgres arrays (text[]
# columns).
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-json",
    "with-chrono",
    "with-uuid",
    "postgres-array",
] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# HTTP server. The OpenAPI 3.1 description is derived from the router itself
# and never post-processed (docs/adr/0002, docs/adr/0003). `openapi32` stays
# off, so a construct only OpenAPI 3.2 can describe does not compile.
kynos = { version = "0.6.1", default-features = false, features = [
    "openapi31",
    "macros",
    "server",
    "http1",
    "http2",
    "json",
    "multipart",
    "cookie",
    "compression",
    "trace",
    "uuid1",
    "time-jiff02",
    "docs",
] }

# Sign-in: OpenID Connect authorization code flow with PKCE and full id_token
# verification (docs/adr/0004). Default features are off so it brings no HTTP
# client of its own: Stacks hands it the workspace reqwest through oauth2's
# `AsyncHttpClient`, so the shipped crates carry one reqwest.
openidconnect = { version = "4", default-features = false }

# IDs — every primary key is a UUIDv7 (time-ordered, so keyset pagination on
# `id` is also chronological).
uuid = { version = "1", features = ["v7", "serde"] }

# Hashing / encoding
base64 = "0.23"
sha2 = "0.11"
# Signs outbound notification webhooks (X-Stacks-Signature).
hmac = "0.13"
hex = "0.4"
rand = "0.10"

# Testing
proptest = "1"

# Time. core and the database keep chrono; the API edge carries jiff, which
# kynos describes natively (its chrono mapping is deprecated: chrono is
# unmaintained). api/src/temporal.rs converts between the two.
chrono = { version = "0.4", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }

# Config & import/export formats
toml = "1"
csv = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
# The backup format's JSON Schema (docs/backup-format.schema.json) is derived
# from its Rust types, never written by hand.
schemars = { version = "1.2", features = ["chrono04", "uuid1"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# HTTP client (OIDC, notification channels, the AniList extras query). The
# major cameo and the e2e crate's spargen client also use, so the lock holds
# one reqwest.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }

# Media metadata SDK — unified TMDB + AniList access. Only the metadata
# adapter (`core/src/media/provider.rs` + `mapping.rs`) may name its types;
# everything else goes through Stacks' `MetadataProvider` trait. Pinned to the
# cameo v0.5.0 release commit until 0.5.0 is on crates.io, when this goes back
# to `version = "0.5"` (#150). The `cache` feature is off by choice, not because of a
# link conflict: Stacks' catalog snapshot in PostgreSQL is the durable cache.
cameo = { git = "https://github.com/justin13888/cameo", rev = "b956b94a0a737eae273a0caa24b8dec312c51bc9", default-features = false, features = ["tmdb", "anilist"] }

# Fault-injection tests for the metadata adapter and the mock OIDC issuer.
wiremock = "0.6"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }

# Full DWARF debug info bloats target/ under fast dev/test iteration. Line
# tables keep file:line in the workspace crates' backtraces; dependency frames
# keep their symbol names but lose file:line. For full debug info (locals and
# types in a debugger), override per build: `CARGO_PROFILE_DEV_DEBUG=2`
# (workspace crates) or `cargo --config 'profile.dev.package."*".debug=2' ...`
# (dependencies).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The test identity provider generates RSA keys (rsa 0.10, over crypto-bigint
# and crypto-primes) and signs with them through openidconnect (rsa 0.9, over
# num-bigint-dig); unoptimised big-integer arithmetic makes either take tens
# of seconds in a debug build.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3
