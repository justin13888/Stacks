# Dex — development-only OIDC provider.
#
# Stacks has no local accounts by design, so without an identity provider you
# cannot sign in even once. This config exists purely so `mise run up` produces a
# stack you can actually log into. It is opt-in via the `dev-idp` compose
# profile; production deployments point WW_OIDC_* at a real provider and never
# start this container.
#
# !! The client secret and user password below are public, fixed, and for local
# !! development only. Never expose this service outside localhost.

# Must match WW_OIDC_ISSUER — the value the browser uses. The API reaches Dex on
# the compose network instead, via WW_OIDC_INTERNAL_ISSUER.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # Skip the "grant access to this app?" interstitial — there is one client and
  # the users are local test accounts, so the extra click adds nothing.
  skipApprovalScreen: true

staticClients:
  - id: stacks
    name: Stacks
    secret: stacks-dev-client-secret
    redirectURIs:
      # The SPA handles the callback and forwards the code to the API.
      - http://localhost:3000/auth/callback
      # Vite's default port, for `mise run dev:web` outside containers.
      - http://localhost:5173/auth/callback

enablePasswordDB: true
staticPasswords:
  # Both passwords are "password" (bcrypt hash below). The second account
  # exists so a backup can be restored into a fresh user: the e2e suite signs
  # in as each, and so can you when trying an export and re-import by hand.
  - email: dev@stacks.local
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: dev
    userID: "00000000-0000-0000-0000-000000000001"
  - email: friend@stacks.local
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: friend
    userID: "00000000-0000-0000-0000-000000000002"
